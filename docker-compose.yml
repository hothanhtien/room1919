version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finance1919-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=finance1919_secret_key_2026
      - DATABASE_URL=postgres://postgres:1@100.98.146.87:5432/finance1919
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: finance1919-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
  
  nginx:
    image: nginx:alpine
    container_name: finance1919-nginx
    ports:
      - "1919:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
  
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    depends_on:
      - nginx
    volumes:
      - ./cloudflared:/etc/cloudflared
    command: tunnel run
    networks:
      - exposed-net

networks:
  internal:
    driver: bridge
  exposed-net:
    driver: bridge